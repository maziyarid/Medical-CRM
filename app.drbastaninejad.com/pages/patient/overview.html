<!doctype html>
<!--
  MΛZ Medical CRM — Patient Overview
  Author: MAZ//ID (Maziyar) · © 2026 Maziyar / Dr. Shahin Bastaninejad
  API:  GET /api/v1/patient/overview  ✅ LIVE (2026-07-30, Blackbox AI Phase C)
  Response shape confirmed in docs/API_CONTRACT.md §GET /patient/overview:
    patient_name, next_appointment{scheduled_at,duration_minutes,reason,status},
    total_intakes, total_documents, last_intake_date
  Note: requireAuth() guard redirects to patient-login if no token.
-->
<html dir="rtl" lang="fa-IR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>نمای کلی — داشبورد بیمار</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg"/>
  <link rel="stylesheet" href="../../assets/css/tokens.css"/>
  <link rel="stylesheet" href="../../assets/css/tokens-extended.css"/>
  <link rel="stylesheet" href="../../assets/css/base.css"/>
  <link rel="stylesheet" href="../../assets/css/states.css"/>
  <link rel="stylesheet" href="../../assets/css/components.css"/>
  <style>
    /* Slot visibility controlled by data-state */
    [data-state] .slot-loading,
    [data-state] .slot-ready,
    [data-state] .slot-pending,
    [data-state] .slot-error { display: none !important; }
    [data-state="loading"]  .slot-loading  { display: block !important; }
    [data-state="ready"]    .slot-ready    { display: block !important; }
    [data-state="pending"]  .slot-pending  { display: block !important; }
    [data-state="error"]    .slot-error    { display: block !important; }
    /* KPI skeleton */
    .kpi-skeleton { height: 80px; border-radius: var(--radius); }
  </style>
</head>
<body data-shell="patient" data-nav="overview">
  <div class="app-shell">
    <main class="main">

      <!-- Topbar — populated once data loads -->
      <div class="topbar">
        <div>
          <h1 id="greeting-head">نمای کلی حساب شما</h1>
          <p class="subtitle">نوبت‌ها، مستندات و یادآوری‌های مهم</p>
        </div>
        <div class="topbar-actions">
          <div class="avatar-chip" id="avatar-chip" hidden>
            <div class="avatar-md" id="avatar-initials" aria-hidden="true">؟</div>
            <span class="who" id="avatar-name">…</span>
          </div>
        </div>
      </div>

      <!-- Main content host -->
      <div id="overview-host" data-state="loading">

        <!-- ── Loading ── -->
        <div class="slot-loading" aria-hidden="true">
          <div class="kpi-grid">
            <div class="skeleton kpi-skeleton"></div>
            <div class="skeleton kpi-skeleton"></div>
            <div class="skeleton kpi-skeleton"></div>
          </div>
          <div class="grid-main" style="margin-top:1.5rem">
            <div class="skeleton" style="height:200px;border-radius:var(--radius)"></div>
            <div class="skeleton" style="height:200px;border-radius:var(--radius)"></div>
          </div>
        </div>
</div>

        <!-- ── Ready ── (shown once API responds) -->
        <div class="slot-ready">
          <div class="kpi-grid">
            <div class="kpi-card">
              <div class="kpi-label">نوبت بعدی</div>
              <div class="kpi-value" id="ov-next-appt" style="font-size:1.2rem">—</div>
              <div class="kpi-delta" id="ov-next-reason">—</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">پرونده‌های ثبت‌شده</div>
              <div class="kpi-value" id="ov-records">—</div>
              <div class="kpi-delta" id="ov-records-sub">—</div>
            </div>
            <div class="kpi-card">
              <div class="kpi-label">مستندات</div>
              <div class="kpi-value" id="ov-docs">—</div>
              <div class="kpi-delta">قابل دانلود</div>
            </div>
          </div>

          <div class="grid-main" style="margin-top:1.5rem">
            <section class="panel">
              <div class="panel-header">
                <div><h3>نوبت‌های پیش رو</h3></div>
                <a href="appointments.html" class="btn btn-ghost btn-sm">مشاهده همه ←</a>
              </div>
              <div id="ov-upcoming-list" role="list"></div>
            </section>

            <section class="panel">
              <div class="panel-header"><div><h3>یادآوری‌های مهم</h3></div></div>
              <ul id="ov-reminders" style="list-style:none;display:flex;flex-direction:column;gap:.75rem"></ul>
            </section>
          </div>
        </div>

        <!-- ── Error ── -->
        <div class="slot-error">
          <div class="state-panel state-error" role="alert">
            <div class="state-icon" aria-hidden="true">⚠️</div>
            <h3>خطا در بارگذاری اطلاعات</h3>
            <p id="ov-error-msg">لطفاً دوباره تلاش کنید.</p>
            <div class="state-actions">
              <button type="button" class="btn btn-secondary btn-sm"
                      id="ov-retry-btn">تلاش مجدد</button>
            </div>
          </div>
        </div>

      </div><!-- /#overview-host -->

    </main>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/jalali.js"></script>
  <script src="../../assets/js/states.js"></script>
  <script src="../../assets/js/chrome.js"></script>
  <script type="module">
    import { requireAuth, Patient, showToast }
      from '../../shared/api.js';

    // ── Auth guard ──────────────────────────────────────────────────────────
    if (!requireAuth('../auth/patient-login.html')) { /* redirecting */ }

    function toFa(n) {
      return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    /**
     * Convert a UTC DATETIME string to Jalali numeric display ("۱۴۰۵/۰۵/۲۴").
     * Falls back to ISO YYYY-MM-DD if Jalali global is unavailable.
     */
    function toJalaliDate(dateStr) {
      if (!dateStr) return '';
      try {
        const d = new Date(String(dateStr).replace(' ', 'T'));
        if (isNaN(d.getTime())) return String(dateStr).substring(0, 10);
        return Jalali.formatNumeric(d);
      } catch (_) {
        return String(dateStr).substring(0, 10);
      }
    }

    function fillAvatar(name) {
      const initials = String(name || '').split(' ')
        .map(w => w[0] || '').slice(0, 2).join('');
      document.getElementById('avatar-initials').textContent = initials || '؟';
      document.getElementById('avatar-name').textContent = name || '';
      document.getElementById('avatar-chip').hidden = false;
      document.getElementById('greeting-head').textContent =
        'سلام، ' + (name || 'کاربر گرامی') + ' 🌿';
    }

    window.loadOverview = async function () {
      const host = document.getElementById('overview-host');
      MAZCRM.states.set(host, 'loading');
      try {
        const res = await Patient.getOverview();
        // Confirmed field names from docs/API_CONTRACT.md §GET /patient/overview
        const d = res.data || {};

        // Avatar / greeting — field: patient_name (confirmed)
        fillAvatar(d.patient_name || '');

        // KPI: next appointment — field: next_appointment{scheduled_at,duration_minutes,reason,status}
        const appt = d.next_appointment;
        if (appt) {
          // scheduled_at is a MySQL DATETIME UTC string e.g. "2026-08-15 14:30:00"
          const jalaliDate = toJalaliDate(appt.scheduled_at);
          const timeStr    = appt.scheduled_at ? String(appt.scheduled_at).substring(11, 16) : '';
          const apptDisplay = [jalaliDate, timeStr ? ('ساعت ' + timeStr) : null]
            .filter(Boolean).join(' — ');
          document.getElementById('ov-next-appt').textContent = apptDisplay || '—';
          document.getElementById('ov-next-reason').textContent = appt.reason || '—';
          /*
           * appointment status label:
           * Assumed: status vocabulary unconfirmed in governance docs — rendered
           * as raw API value only; no hardcoded Persian translation.
           * Backend requirements note: please document the full status enum
           * (values + Persian display labels) in docs/API_CONTRACT.md.
           */
        } else {
          document.getElementById('ov-next-appt').textContent = 'نوبتی ثبت نشده';
          document.getElementById('ov-next-reason').textContent = '';
        }

        // KPI: total intakes — field: total_intakes (confirmed)
        document.getElementById('ov-records').textContent =
          d.total_intakes != null ? toFa(d.total_intakes) : '—';
        document.getElementById('ov-records-sub').textContent =
          d.last_intake_date ? ('آخرین: ' + toJalaliDate(d.last_intake_date)) : '—';

        // KPI: total documents — field: total_documents (confirmed)
        document.getElementById('ov-docs').textContent =
          d.total_documents != null ? toFa(d.total_documents) : '—';

        // Overview returns a single next_appointment only (not a list).
        // Display it in the upcoming list if present.
        const list = document.getElementById('ov-upcoming-list');
        if (appt) {
          const jalaliDate2 = toJalaliDate(appt.scheduled_at);
          const timeStr2    = appt.scheduled_at ? String(appt.scheduled_at).substring(11, 16) : '';
          const apptDisplay = [jalaliDate2, timeStr2 ? ('ساعت ' + timeStr2) : null]
            .filter(Boolean).join(' — ');
          list.innerHTML =
            '<div role="listitem" style="display:flex;align-items:center;gap:1rem;' +
            'padding:.9rem 0;border-bottom:1px solid var(--border);">' +
            '<div style="min-width:0;flex:1">' +
              '<strong style="display:block;font-size:.9rem">' + escHtml(appt.reason || '—') + '</strong>' +
              '<span style="font-size:.78rem;color:var(--muted)">' + escHtml(apptDisplay) + '</span>' +
            '</div>' +
            /* status: render raw value — vocabulary not confirmed, no hardcoded labels */
            (appt.status
              ? '<span class="pill muted" style="font-size:.72rem">' + escHtml(appt.status) + '</span>'
              : '') +
            '</div>';
        } else {
          list.innerHTML =
            '<div class="state-panel state-empty" role="status" style="padding:1rem 0">' +
              '<h3 style="font-size:.9rem">نوبت آینده‌ای ثبت نشده است</h3>' +
            '</div>';
        }

        // Reminders panel: overview endpoint does not return reminders —
        // show a static placeholder.
        document.getElementById('ov-reminders').innerHTML =
          '<li style="color:var(--muted);font-size:.85rem">یادآوری فعالی وجود ندارد.</li>';

        MAZCRM.states.set(host, 'ready');
      } catch (err) {
        if (err.httpStatus === 401) {
          window.location.replace('../auth/patient-login.html');
        } else if (err.httpStatus === 403) {
          window.location.replace('../errors/403.html');
        } else {
          document.getElementById('ov-error-msg').textContent =
            err.message || 'خطای سرور. لطفاً دوباره تلاش کنید.';
          MAZCRM.states.set(host, 'error');
        }
      }
    };

    // Minimal HTML escape for user-supplied strings rendered via innerHTML
    function escHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    document.getElementById('ov-retry-btn')
      .addEventListener('click', loadOverview);

    loadOverview();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صفحه پیدا نشد — ۴۰۴</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap">
  <style>
    :root {
      --evergreen: #2F7D32;
      --evergreen-soft: #E4F0E4;
      --graphite: #25272C;
      --muted: #6A7078;
      --border: #DDE2DD;
      --porcelain: #F7F8F6;
      --surface: #FFFFFF;
      --warning: #D97706;
      --warning-soft: #FFF7ED;
      --font-fa: 'Vazirmatn', 'Vazir', Tahoma, Arial, sans-serif;
      --radius: 1rem;
      --shadow: 0 20px 40px -12px rgba(37,39,44,.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-fa);
      background: var(--porcelain);
      color: var(--graphite);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 3px solid var(--evergreen); outline-offset: 2px; border-radius: 4px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .code-badge {
      display: inline-block;
      background: var(--warning-soft);
      color: var(--warning);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      line-height: 1;
    }
    h1 { font-size: 1.35rem; font-weight: 700; margin-bottom: 0.6rem; }
    p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      max-width: 320px;
      margin-inline: auto;
    }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 1.4rem;
      border-radius: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 150ms;
    }
    .btn:hover { opacity: 0.88; text-decoration: none; }
    .btn-primary { background: var(--evergreen); color: #fff; }
    .btn-ghost   { background: var(--porcelain); color: var(--graphite); border: 1px solid var(--border); }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
      .actions { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <span class="code-badge" aria-hidden="true">۴۰۴ — Not Found</span>
    <div class="icon" role="img" aria-label="صفحه پیدا نشد">🔍</div>
    <h1>صفحه‌ای پیدا نشد</h1>
    <p>
      آدرسی که وارد کردید وجود ندارد یا ممکن است جابه‌جا شده باشد.
      لطفاً آدرس را بررسی کنید یا از منوی پایین استفاده کنید.
    </p>
    <div class="actions">
      <a href="/"                              class="btn btn-primary">بازگشت به خانه</a>
      <a href="/pages/auth/patient-login.html" class="btn btn-ghost">ورود بیمار</a>
    </div>
    <p class="footer-note">
      کد خطا: 404 — Not Found
    </p>
  </main>
</body>
</html>

<!doctype html>
<!--
  MΛZ Medical CRM — Calendar / Scheduling
  Author: MAZ//ID (Maziyar) · © 2026 Maziyar / Dr. Shahin Bastaninejad
  Data:  ✅ LIVE — wired to GET/POST /api/v1/appointments (dashboard API)
  Auth:  Staff Bearer token required.
-->
<html dir="rtl" lang="fa-IR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>تقویم — MΛZ Medical CRM</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg"/>
  <link rel="stylesheet" href="../../assets/css/tokens.css"/>
  <link rel="stylesheet" href="../../assets/css/tokens-extended.css"/>
  <link rel="stylesheet" href="../../assets/css/base.css"/>
  <link rel="stylesheet" href="../../assets/css/states.css"/>
  <link rel="stylesheet" href="../../assets/css/components.css"/>
  <style>
    .view-switch{display:inline-flex;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-md);padding:3px;gap:2px}
    .view-switch button{border:none;background:none;padding:.45rem .9rem;border-radius:var(--radius-sm);font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;font-family:inherit;min-height:36px}
    .view-switch button.active{background:var(--evergreen-soft);color:var(--evergreen)}
    .cal-week-grid{display:grid;grid-template-columns:56px repeat(6,1fr);gap:1px;background:var(--border);border-radius:var(--radius-md);overflow:hidden;overflow-x:auto;min-width:640px}
    .cal-week-grid>div{background:var(--surface);padding:.45rem;min-height:52px;font-size:.78rem}
    .cal-week-grid .hour{background:var(--porcelain);text-align:center;color:var(--muted);font-weight:600;font-size:.7rem;display:flex;align-items:center;justify-content:center}
    .cal-week-grid .head{background:var(--porcelain);text-align:center;font-weight:700;padding:.7rem .4rem;font-size:.8rem}
    .cal-week-grid .head small{display:block;color:var(--muted);font-size:.68rem;font-weight:500}
    .cal-week-grid .head.today{background:var(--evergreen-soft);color:var(--evergreen)}
    .appt-block{background:var(--evergreen);color:#fff;padding:.3rem .5rem;border-radius:5px;font-size:.7rem;font-weight:600;margin-bottom:2px;cursor:pointer;transition:opacity var(--transition-fast)}
    .appt-block:hover{opacity:.85}
    .appt-block.info{background:var(--info)}
    .appt-block.warning{background:var(--warning);color:var(--graphite)}
    .appt-block.error{background:var(--error)}
    .appt-block.muted{background:var(--muted);opacity:.7}
    .conflict-banner{display:flex;align-items:center;gap:.75rem;background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:var(--radius-md);padding:.75rem 1rem;font-size:.82rem;margin-bottom:1.25rem}
    .cal-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
    /* New appointment modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:400;align-items:center;justify-content:center;padding:1rem}
    .modal-overlay.open{display:flex}
    .modal-box{background:#fff;border-radius:var(--radius);padding:1.5rem;width:100%;max-width:460px;max-height:90vh;overflow-y:auto}
    .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1.25rem}
    .modal-close{background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);line-height:1;min-height:36px;min-width:36px}
  </style>
</head>
<body data-shell="staff" data-nav="calendar">
  <div class="app-shell">
    <main class="main">

      <div class="topbar">
        <div>
          <h1>تقویم و نوبت‌دهی</h1>
          <p class="subtitle" id="cal-range-label">در حال بارگذاری…</p>
        </div>
        <div class="topbar-actions">
          <div class="view-switch" role="group" aria-label="نمای تقویم">
            <button data-view="day">روز</button>
            <button class="active" data-view="week">هفته</button>
            <button data-view="month">ماه</button>
            <button data-view="list">لیست</button>
          </div>
          <button class="btn btn-secondary btn-sm" id="prev-btn" aria-label="هفته قبل">‹</button>
          <button class="btn btn-secondary btn-sm" id="next-btn" aria-label="هفته بعد">›</button>
          <button class="btn btn-primary btn-sm" id="new-appt-btn">+ نوبت جدید</button>
        </div>
      </div>

      <!-- Conflict banner — hidden until conflict detected -->
      <div class="conflict-banner" id="conflict-banner" hidden role="alert">
        <span aria-hidden="true">⚠️</span>
        <span id="conflict-msg"></span>
        <button class="btn btn-ghost btn-sm" id="conflict-dismiss" style="margin-inline-start:auto">بستن</button>
      </div>

      <!-- State containers -->
      <div id="cal-loading" class="state-loading" role="status" aria-live="polite">
        <div class="skeleton-row"><div class="skeleton skeleton-line" style="width:100%;height:360px;border-radius:var(--radius-md)"></div></div>
      </div>
      <div id="cal-error" class="state-error" role="alert" hidden></div>
      <div id="cal-empty" class="state-empty" hidden>
        <p>هیچ نوبتی در این بازه وجود ندارد.</p>
      </div>

      <!-- Week grid -->
      <section class="panel" id="cal-panel" hidden>
        <div class="cal-scroll">
          <div class="cal-week-grid" id="cal-grid" role="grid" aria-label="تقویم هفتگی"></div>
        </div>
      </section>

    </main>
  </div>

  <!-- New appointment modal -->
  <div class="modal-overlay" id="new-appt-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-box">
      <div class="modal-header">
        <h2 id="modal-title" style="font-size:1rem">نوبت جدید</h2>
        <button class="modal-close" id="modal-close" aria-label="بستن">×</button>
      </div>
      <div id="modal-error" class="state-error" style="margin-bottom:.75rem" hidden></div>
      <div class="grid-2" style="gap:1rem">
        <div class="input-group" style="grid-column:1/-1">
          <label class="form-label" for="appt-patient-id">شناسه بیمار <span aria-hidden="true" style="color:var(--error)">*</span></label>
          <input class="form-input" id="appt-patient-id" type="number" placeholder="شناسه عددی بیمار" required/>
        </div>
        <div class="input-group" style="grid-column:1/-1">
          <label class="form-label" for="appt-provider-id">شناسه پزشک <span aria-hidden="true" style="color:var(--error)">*</span></label>
          <input class="form-input" id="appt-provider-id" type="number" placeholder="شناسه عددی پزشک" required/>
        </div>
        <div class="input-group" style="grid-column:1/-1">
          <label class="form-label" for="appt-at">تاریخ و ساعت <span aria-hidden="true" style="color:var(--error)">*</span></label>
          <input class="form-input" id="appt-at" type="datetime-local" required/>
        </div>
        <div class="input-group">
          <label class="form-label" for="appt-duration">مدت (دقیقه)</label>
          <input class="form-input" id="appt-duration" type="number" value="20" min="5" max="480"/>
        </div>
        <div class="input-group">
          <label class="form-label" for="appt-room">اتاق</label>
          <input class="form-input" id="appt-room" placeholder="اتاق ۱"/>
        </div>
        <div class="input-group" style="grid-column:1/-1">
          <label class="form-label" for="appt-reason">علت مراجعه</label>
          <input class="form-input" id="appt-reason" placeholder="مشاوره اولیه — رینوپلاستی"/>
        </div>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.25rem">
        <button class="btn btn-ghost btn-sm" id="modal-cancel">انصراف</button>
        <button class="btn btn-primary btn-sm" id="modal-save">
          <span class="btn-submit-text">ذخیره نوبت</span>
          <span class="btn-submit-loading" hidden aria-hidden="true">در حال ثبت…</span>
        </button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/states.js"></script>
  <script src="../../assets/js/chrome.js"></script>
  <script type="module">
    import { Staff, escHtml, requireAuth, redirectOn401 } from '../../shared/api.js';
    if (!requireAuth('../auth/login.html')) { /* redirecting */ }

    // ── State ──────────────────────────────────────────────────────
    const HOURS = [9,10,11,12,15,16,17,18];
    const DAYS_FA = ['شنبه','یکشنبه','دوشنبه','سه‌شنبه','چهارشنبه','پنجشنبه'];
    let weekOffset = 0; // 0 = current week

    // ── Elements ───────────────────────────────────────────────────
    const grid        = document.getElementById('cal-grid');
    const panel       = document.getElementById('cal-panel');
    const loading     = document.getElementById('cal-loading');
    const errorEl     = document.getElementById('cal-error');
    const emptyEl     = document.getElementById('cal-empty');
    const rangeLabel  = document.getElementById('cal-range-label');
    const conflictBanner = document.getElementById('conflict-banner');
    const conflictMsg = document.getElementById('conflict-msg');
    const modal       = document.getElementById('new-appt-modal');
    const modalError  = document.getElementById('modal-error');

    // ── Week helpers ────────────────────────────────────────────────
    function weekStartFor(offset) {
      const d = new Date();
      // Saturday = day 6 in JS (0=Sun…6=Sat)
      const day = d.getDay(); // 0=Sun
      const diffToSat = (day === 6) ? 0 : (6 - day); // days until Saturday
      d.setDate(d.getDate() + diffToSat + offset * 7);
      d.setHours(0,0,0,0);
      return d;
    }

    function isoDate(d) {
      return d.toISOString().slice(0,10);
    }

    function toPersianDigits(n) {
      return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    // ── Render ─────────────────────────────────────────────────────
    async function load() {
      const start = weekStartFor(weekOffset);
      // Week: Sat → Thu (6 days)
      const end = new Date(start);
      end.setDate(end.getDate() + 6);
      end.setHours(23,59,59);

      const fromStr = `${isoDate(start)} 00:00:00`;
      const toStr   = `${isoDate(end)} 23:59:59`;

      // Update range label
      const startDay = toPersianDigits(start.getDate());
      const endDay   = toPersianDigits(end.getDate());
      rangeLabel.textContent = `هفته ${startDay} — ${endDay} (نمونه Jalali)`;

      loading.hidden = false;
      panel.hidden = true;
      errorEl.hidden = true;
      emptyEl.hidden = true;
      conflictBanner.hidden = true;

      let events = [];
      try {
        const res = await Staff.listAppointments({ from: fromStr, to: toStr });
        events = res.data?.events ?? [];
      } catch (err) {
        if (redirectOn401(err, '../auth/login.html')) return;
        loading.hidden = true;
        errorEl.hidden = false;
        errorEl.textContent = err.message || 'خطا در بارگذاری تقویم';
        return;
      }

      loading.hidden = true;

      if (events.length === 0) {
        emptyEl.hidden = false;
        panel.hidden = false;
        renderGrid(start, []);
        return;
      }

      panel.hidden = false;
      renderGrid(start, events);

      // Conflict detection — same provider, overlapping times
      const byProvider = {};
      events.forEach(e => {
        const pid = e.provider_id;
        if (!byProvider[pid]) byProvider[pid] = [];
        byProvider[pid].push(e);
      });
      let hasConflict = false;
      Object.values(byProvider).forEach(group => {
        group.sort((a,b) => new Date(a.start) - new Date(b.start));
        for (let i = 0; i < group.length - 1; i++) {
          const aEnd = new Date(group[i].start).getTime() + group[i].duration_minutes * 60000;
          const bStart = new Date(group[i+1].start).getTime();
          if (aEnd > bStart) { hasConflict = true; break; }
        }
      });
      if (hasConflict) {
        conflictMsg.textContent = 'تداخل نوبت شناسایی شد — برخی نوبت‌های این هفته همزمان هستند.';
        conflictBanner.hidden = false;
      }
    }

    function renderGrid(weekStart, events) {
      // Build day columns: Sat+0 … Sat+5 (Sat–Thu)
      const days = Array.from({length: 6}, (_, i) => {
        const d = new Date(weekStart);
        d.setDate(d.getDate() + i);
        return d;
      });

      const today = isoDate(new Date());

      // Map events by dayDate → hourSlot
      const slotMap = {};
      events.forEach(e => {
        const d = new Date(e.start);
        const key = `${isoDate(d)}:${d.getHours()}`;
        if (!slotMap[key]) slotMap[key] = [];
        slotMap[key].push(e);
      });

      let html = '';
      // Header row: empty + 6 day headers
      html += '<div class="head" role="columnheader"></div>';
      days.forEach((d, i) => {
        const isToday = isoDate(d) === today;
        html += `<div class="head${isToday ? ' today' : ''}" role="columnheader">${escHtml(DAYS_FA[i])}<small>${toPersianDigits(d.getDate())}</small></div>`;
      });

      // Hour rows
      HOURS.forEach(hr => {
        html += `<div class="hour" role="rowheader">${toPersianDigits(hr)}</div>`;
        days.forEach(d => {
          const key = `${isoDate(d)}:${hr}`;
          const slot = slotMap[key] || [];
          let cellHtml = '';
          slot.forEach(e => {
            const badge = escHtml(e.badge || 'success');
            const name = escHtml(e.patient_name || '');
            const reason = escHtml(e.reason || '');
            cellHtml += `<div class="appt-block ${badge}" role="button" tabindex="0"
              data-id="${e.id}" aria-label="${name} — ${reason}">${name}${reason ? ` — ${reason}` : ''}</div>`;
          });
          html += `<div role="gridcell">${cellHtml}</div>`;
        });
      });

      grid.innerHTML = html;

      // Status-change on click
      grid.querySelectorAll('.appt-block').forEach(el => {
        el.addEventListener('click', () => openStatusModal(el.dataset.id));
      });
    }

    async function openStatusModal(id) {
      const status = window.prompt('وضعیت جدید (scheduled / confirmed / cancelled / completed):');
      if (!status) return;
      try {
        await Staff.setAppointmentStatus(Number(id), status);
        await load();
      } catch (err) {
        alert(err.message || 'خطا در تغییر وضعیت');
      }
    }

    // ── View switch ─────────────────────────────────────────────────
    document.querySelectorAll('.view-switch button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.view-switch button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        // Only week view fully rendered; others fall back gracefully
        if (btn.dataset.view !== 'week') {
          panel.hidden = false;
          emptyEl.hidden = false;
          emptyEl.querySelector('p').textContent = `نمای "${btn.textContent.trim()}" در حال توسعه است — هفتگی فعال.`;
          btn.closest('.view-switch').querySelector('[data-view="week"]').classList.add('active');
          btn.classList.remove('active');
        }
      });
    });

    document.getElementById('prev-btn').addEventListener('click', () => { weekOffset--; load(); });
    document.getElementById('next-btn').addEventListener('click', () => { weekOffset++; load(); });

    document.getElementById('conflict-dismiss').addEventListener('click', () => { conflictBanner.hidden = true; });

    // ── New appointment modal ────────────────────────────────────────
    document.getElementById('new-appt-btn').addEventListener('click', () => {
      modalError.hidden = true;
      modal.classList.add('open');
    });
    function closeModal() { modal.classList.remove('open'); }
    document.getElementById('modal-close').addEventListener('click', closeModal);
    document.getElementById('modal-cancel').addEventListener('click', closeModal);
    modal.addEventListener('click', e => { if (e.target === modal) closeModal(); });

    document.getElementById('modal-save').addEventListener('click', async () => {
      const btn = document.getElementById('modal-save');
      const saveText = btn.querySelector('.btn-submit-text');
      const saveLoading = btn.querySelector('.btn-submit-loading');

      const patientId = Number(document.getElementById('appt-patient-id').value);
      const providerId = Number(document.getElementById('appt-provider-id').value);
      const scheduledAt = document.getElementById('appt-at').value;
      const duration = Number(document.getElementById('appt-duration').value) || 20;
      const room = document.getElementById('appt-room').value.trim();
      const reason = document.getElementById('appt-reason').value.trim();

      if (!patientId || !providerId || !scheduledAt) {
        modalError.textContent = 'فیلدهای الزامی را تکمیل کنید.';
        modalError.hidden = false;
        return;
      }

      btn.disabled = true;
      saveText.hidden = true;
      saveLoading.hidden = false;
      modalError.hidden = true;

      try {
        await Staff.createAppointment({ patient_id: patientId, provider_id: providerId,
          scheduled_at: scheduledAt.replace('T',' ') + ':00', duration_minutes: duration,
          room: room || undefined, visit_reason: reason || undefined });
        closeModal();
        await load();
      } catch (err) {
        if (err.httpStatus === 409) {
          modalError.textContent = 'تداخل نوبت — این بازه زمانی اشغال است.';
        } else {
          modalError.textContent = err.message || 'خطا در ثبت نوبت';
        }
        modalError.hidden = false;
      } finally {
        btn.disabled = false;
        saveText.hidden = false;
        saveLoading.hidden = true;
      }
    });

    load();
  </script>
</body>
</html>

<!doctype html>
<!-- MΛZ Medical CRM — Analytics · Author: MAZ//ID · © 2026 Maziyar -->
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>گزارش‌ها — MΛZ Medical CRM</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg"/>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../assets/css/tokens.css"/><link rel="stylesheet" href="../../assets/css/base.css"/>
  <style>
    .chart-box { height:280px;background:linear-gradient(180deg,var(--evergreen-soft) 0%,transparent 100%);border-radius:var(--radius-md);position:relative;overflow:hidden; }
    .chart-bars { display:flex;align-items:end;gap:.7rem;padding:1rem;height:100%; }
    .chart-bars .bar { flex:1;background:linear-gradient(180deg,var(--evergreen),var(--evergreen-dark));border-radius:6px 6px 0 0;position:relative; }
    .chart-bars .bar span { position:absolute;bottom:-1.4rem;inset-inline-start:0;inset-inline-end:0;text-align:center;font-size:.72rem;color:var(--muted); }
  </style>
</head>
<body data-shell="staff" data-nav="analytics">
  <div class="app-shell">
    <main class="main">
      <div class="topbar"><div><h1>گزارش‌ها و تحلیل‌ها</h1><p class="subtitle">۳۰ روز اخیر</p></div></div>

      <div class="kpi-grid">
        <div class="kpi-card"><div class="kpi-label">مراجعین جدید</div><div class="kpi-value">۸۷</div><div class="kpi-delta up">▲ ۲۴٪</div></div>
        <div class="kpi-card"><div class="kpi-label">نرخ تبدیل مشاوره → عمل</div><div class="kpi-value">۳۲٪</div><div class="kpi-delta up">▲ ۴٪</div></div>
        <div class="kpi-card"><div class="kpi-label">درآمد ماه</div><div class="kpi-value">۴۸۲م</div><div class="kpi-delta up">▲ ۱۸٪</div></div>
        <div class="kpi-card"><div class="kpi-label">نرخ بازگشت بیمار</div><div class="kpi-value">۶۸٪</div><div class="kpi-delta">۶ ماه اخیر</div></div>
      </div>

      <div class="grid-2" style="gap:1.5rem;">
        <section class="panel">
          <div class="panel-header"><div><h3>مراجعین جدید — ماه گذشته</h3><p>روزانه</p></div></div>
          <div class="chart-box">
            <div class="chart-bars">
              <div class="bar" style="height:40%"><span>ش</span></div>
              <div class="bar" style="height:55%"><span>ی</span></div>
              <div class="bar" style="height:68%"><span>د</span></div>
              <div class="bar" style="height:45%"><span>س</span></div>
              <div class="bar" style="height:72%"><span>چ</span></div>
              <div class="bar" style="height:80%"><span>پ</span></div>
              <div class="bar" style="height:35%"><span>ج</span></div>
            </div>
          </div>
        </section>

        <section class="panel">
          <div class="panel-header"><div><h3>منابع مراجعه</h3><p>توزیع کانال‌ها</p></div></div>
          <ul style="list-style:none;display:flex;flex-direction:column;gap:.75rem;font-size:.88rem;">
            <li style="display:flex;justify-content:space-between;align-items:center;"><span>اینستاگرام</span><span style="display:flex;align-items:center;gap:.5rem"><span style="width:80px;height:6px;background:var(--evergreen);border-radius:3px"></span><strong>۴۲٪</strong></span></li>
            <li style="display:flex;justify-content:space-between;align-items:center;"><span>معرفی دوستان</span><span style="display:flex;align-items:center;gap:.5rem"><span style="width:60px;height:6px;background:var(--evergreen);border-radius:3px"></span><strong>۲۸٪</strong></span></li>
            <li style="display:flex;justify-content:space-between;align-items:center;"><span>گوگل</span><span style="display:flex;align-items:center;gap:.5rem"><span style="width:35px;height:6px;background:var(--evergreen);border-radius:3px"></span><strong>۱۸٪</strong></span></li>
            <li style="display:flex;justify-content:space-between;align-items:center;"><span>وب‌سایت</span><span style="display:flex;align-items:center;gap:.5rem"><span style="width:20px;height:6px;background:var(--evergreen);border-radius:3px"></span><strong>۸٪</strong></span></li>
            <li style="display:flex;justify-content:space-between;align-items:center;"><span>سایر</span><span style="display:flex;align-items:center;gap:.5rem"><span style="width:10px;height:6px;background:var(--muted);border-radius:3px"></span><strong>۴٪</strong></span></li>
          </ul>
        </section>
      </div>
    </main>
  </div>
  <script src="../../assets/js/app.js"></script><script src="../../assets/js/chrome.js"></script>
</body>
</html>

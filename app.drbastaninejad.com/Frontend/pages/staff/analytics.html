<!doctype html>
<!--
  MΛZ Medical CRM — Analytics & Reports
  Author: MAZ//ID (Maziyar) · © 2026 Maziyar / Dr. Shahin Bastaninejad
  Data:  ✅ Wired to GET /api/v1/analytics/summary (Staff API, Phase D)
  Auth:  Staff Bearer token required.
-->
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>گزارش‌ها — MΛZ Medical CRM</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg"/>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../assets/css/tokens.css"/>
  <link rel="stylesheet" href="../../assets/css/tokens-extended.css"/>
  <link rel="stylesheet" href="../../assets/css/base.css"/>
  <link rel="stylesheet" href="../../assets/css/states.css"/>
  <link rel="stylesheet" href="../../assets/css/components.css"/>
  <style>
    .chart-box {
      height: 240px;
      background: linear-gradient(180deg, var(--evergreen-soft) 0%, transparent 100%);
      border-radius: var(--radius-md);
      position: relative; overflow: hidden;
      padding-bottom: 1.8rem;
    }
    .chart-bars {
      display: flex; align-items: flex-end; gap: .5rem;
      padding: 1rem 1rem 0; height: 100%;
    }
    .chart-bars .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--evergreen), var(--evergreen-dark));
      border-radius: 6px 6px 0 0;
      position: relative; min-width: 0;
      transition: opacity var(--transition-fast);
    }
    .chart-bars .bar:hover { opacity: .85; }
    .chart-bars .bar span {
      position: absolute; bottom: -1.6rem;
      inset-inline-start: 0; inset-inline-end: 0;
      text-align: center; font-size: .7rem; color: var(--muted);
    }
    .ref-bar { height: 6px; border-radius: 3px; background: var(--evergreen); display: inline-block; }
    .date-switch {
      display: inline-flex; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius-md);
      padding: 3px; gap: 2px;
    }
    .date-switch button {
      border: none; background: none; padding: .38rem .85rem;
      border-radius: var(--radius-sm); font-size: .8rem; font-weight: 600;
      color: var(--muted); cursor: pointer; font-family: inherit;
    }
    .date-switch button.active { background: var(--evergreen-soft); color: var(--evergreen); }
  </style>
</head>
<body data-shell="staff" data-nav="analytics">
  <div class="app-shell">
    <main class="main">

      <div class="topbar">
        <div>
          <h1>گزارش‌ها و تحلیل‌ها</h1>
          <p class="subtitle" id="analytics-subtitle">در حال بارگذاری…</p>
        </div>
        <div class="topbar-actions">
          <div class="date-switch" role="group" aria-label="بازه زمانی" id="range-switcher">
            <button data-range="30d" class="active">۳۰ روز</button>
            <button data-range="90d">۳ ماه</button>
            <button data-range="1y">سال</button>
          </div>
        </div>
      </div>

      <!-- KPI cards -->
      <div class="kpi-grid" id="kpi-grid" aria-live="polite">
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
      </div>

      <div class="grid-2" style="gap:1.5rem;margin-top:1.5rem">

        <!-- Bar chart -->
        <section class="panel">
          <div class="panel-header">
            <div><h3>مراجعین جدید — هفته‌ای</h3><p id="chart-subtitle">۳۰ روز گذشته</p></div>
          </div>
          <div class="chart-box" role="img" aria-label="نمودار میله‌ای مراجعین جدید">
            <div class="chart-bars" id="chart-bars">
              <div class="bar" style="height:20%"><span>…</span></div>
              <div class="bar" style="height:20%"><span>…</span></div>
              <div class="bar" style="height:20%"><span>…</span></div>
              <div class="bar" style="height:20%"><span>…</span></div>
            </div>
          </div>
        </section>

        <!-- Referral sources -->
        <section class="panel">
          <div class="panel-header">
            <div><h3>منابع مراجعه</h3><p>توزیع کانال‌های ورودی بیماران</p></div>
          </div>
          <ul id="referral-list"
              style="list-style:none;display:flex;flex-direction:column;gap:.9rem;font-size:.88rem;"
              role="list" aria-live="polite">
            <li><div class="skeleton skeleton-line" style="width:80%"></div></li>
            <li><div class="skeleton skeleton-line" style="width:70%"></div></li>
            <li><div class="skeleton skeleton-line" style="width:60%"></div></li>
          </ul>
        </section>

      </div><!-- /.grid-2 -->

    </main>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/states.js"></script>
  <script src="../../assets/js/chrome.js"></script>
  <script type="module">
    import { Staff, renderError, showToast, escHtml } from '../../shared/api.js';

    const RANGE_LABELS = { '30d': '۳۰ روز گذشته', '90d': '۳ ماه گذشته', '1y': 'یک سال گذشته' };
    let currentRange = '30d';

    function toPersianNum(n) {
      return String(n).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
    }

    function renderKpis(kpis) {
      const grid = document.getElementById('kpi-grid');
      if (!kpis) { grid.innerHTML = '<p class="state-error">داده KPI دریافت نشد.</p>'; return; }
      grid.innerHTML = [
        { label: 'مراجعین جدید', value: kpis.new_patients ?? '—', delta: kpis.new_patients_delta, up: (kpis.new_patients_delta_dir === 'up') },
        { label: 'نرخ تبدیل مشاوره → عمل', value: kpis.conversion_rate != null ? toPersianNum(kpis.conversion_rate) + '٪' : '—', delta: kpis.conversion_rate_delta, up: (kpis.conversion_rate_delta_dir === 'up') },
        { label: 'درآمد دوره (تومان)', value: kpis.revenue_label ?? '—', delta: kpis.revenue_delta, up: (kpis.revenue_delta_dir === 'up') },
        { label: 'نرخ بازگشت بیمار', value: kpis.return_rate != null ? toPersianNum(kpis.return_rate) + '٪' : '—', delta: kpis.return_rate_label ?? '', up: false },
      ].map(k => `
        <div class="kpi-card">
          <div class="kpi-label">${escHtml(k.label)}</div>
          <div class="kpi-value">${escHtml(String(k.value))}</div>
          ${k.delta ? `<div class="kpi-delta ${k.up ? 'up' : ''}">${k.up ? '▲ ' : ''}${escHtml(String(k.delta))}</div>` : ''}
        </div>`).join('');
    }

    function renderChart(weeks) {
      const container = document.getElementById('chart-bars');
      if (!weeks || !weeks.length) {
        container.innerHTML = '<p style="color:var(--muted);font-size:.8rem;align-self:center">داده‌ای برای نمایش وجود ندارد.</p>';
        return;
      }
      const max = Math.max(...weeks.map(w => w.count || 0)) || 1;
      container.innerHTML = weeks.map(w => {
        const pct = Math.round(((w.count || 0) / max) * 90) + 5;
        return `<div class="bar" style="height:${pct}%" title="${escHtml(String(w.count || 0))} بیمار"><span>${escHtml(w.label || '')}</span></div>`;
      }).join('');
    }

    function renderReferrals(sources) {
      const list = document.getElementById('referral-list');
      if (!sources || !sources.length) {
        list.innerHTML = '<li style="color:var(--muted);font-size:.85rem">داده‌ای موجود نیست.</li>';
        return;
      }
      const maxPct = Math.max(...sources.map(s => s.percent || 0)) || 1;
      list.innerHTML = sources.map(s => {
        const barW = Math.round((s.percent / maxPct) * 96);
        return `<li style="display:flex;justify-content:space-between;align-items:center;">
          <span>${escHtml(s.source || '')}</span>
          <span style="display:flex;align-items:center;gap:.5rem">
            <span class="ref-bar" style="width:${barW}px"></span>
            <strong>${toPersianNum(s.percent)}٪</strong>
          </span>
        </li>`;
      }).join('');
    }

    async function loadAnalytics(range) {
      document.getElementById('analytics-subtitle').textContent = 'در حال بارگذاری…';
      document.getElementById('chart-subtitle').textContent = RANGE_LABELS[range] || '';
      try {
        const res = await Staff.getAnalytics({ range });
        const d = res.data || res;

        // Normalize kpis: backend returns array [{key,value,delta_pct,delta_dir}]
        // renderKpis() expects an object keyed by metric name
        let kpisObj = d.kpis;
        if (Array.isArray(d.kpis)) {
          kpisObj = {};
          d.kpis.forEach(k => {
            if (k.key === 'new_patients')    { kpisObj.new_patients = k.value; kpisObj.new_patients_delta = k.delta_pct ? toPersianNum(k.delta_pct) + '٪' : null; kpisObj.new_patients_delta_dir = k.delta_dir; }
            if (k.key === 'conversion_rate') { kpisObj.conversion_rate = k.value; kpisObj.conversion_rate_delta = k.delta_pct ? toPersianNum(k.delta_pct) + '٪' : null; kpisObj.conversion_rate_delta_dir = k.delta_dir; }
            if (k.key === 'revenue')         { kpisObj.revenue_label = k.value > 0 ? toPersianNum(Math.round(k.value / 10_000_000)) + 'م' : '—'; kpisObj.revenue_delta = k.delta_pct ? toPersianNum(k.delta_pct) + '٪' : null; kpisObj.revenue_delta_dir = k.delta_dir; }
            if (k.key === 'return_rate')     { kpisObj.return_rate = k.value; kpisObj.return_rate_label = ''; }
          });
        }

        // Normalize chart: backend returns {week, count}; renderChart expects {label, count}
        const rawChart = d.chart_new_patients || d.weekly_chart || d.chart || [];
        const chart = rawChart.map((w, i) => ({
          label: w.label || ('هـ' + toPersianNum(i + 1)),
          count: w.count ?? w.cnt ?? 0,
        }));

        // Normalize referrals: backend returns {source, count, pct}; renderReferrals expects {source, percent}
        const rawRef = d.referral_sources || d.referrals || [];
        const referrals = rawRef.map(r => ({ source: r.source, percent: r.pct ?? r.percent ?? 0 }));

        renderKpis(kpisObj);
        renderChart(chart);
        renderReferrals(referrals);
        document.getElementById('analytics-subtitle').textContent = RANGE_LABELS[range] || '';
      } catch (err) {
        document.getElementById('analytics-subtitle').textContent = 'خطا در بارگذاری';
        renderError(document.getElementById('kpi-grid'), err);
        showToast(err.message || 'خطا در بارگذاری گزارش‌ها', 'error');
      }
    }

    // Range switcher
    document.getElementById('range-switcher').addEventListener('click', function(e) {
      const btn = e.target.closest('button[data-range]');
      if (!btn) return;
      document.querySelectorAll('#range-switcher button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentRange = btn.dataset.range;
      loadAnalytics(currentRange);
    });

    loadAnalytics(currentRange);
  </script>
</body>
</html>

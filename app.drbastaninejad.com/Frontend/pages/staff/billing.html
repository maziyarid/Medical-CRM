<!doctype html>
<!--
  MΛZ Medical CRM — Billing
  Author: MAZ//ID (Maziyar) · © 2026 Maziyar / Dr. Shahin Bastaninejad
  Data:  ✅ Wired to GET/POST /api/v1/billing/invoices, PATCH /status (Staff API, Phase D)
  Auth:  Staff Bearer token required.
-->
<html dir="rtl" lang="fa-IR">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>صورتحساب — MΛZ Medical CRM</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg"/>
  <link rel="stylesheet" href="../../assets/css/tokens.css"/>
  <link rel="stylesheet" href="../../assets/css/tokens-extended.css"/>
  <link rel="stylesheet" href="../../assets/css/base.css"/>
  <link rel="stylesheet" href="../../assets/css/states.css"/>
  <link rel="stylesheet" href="../../assets/css/components.css"/>
  <style>
    .filter-bar {
      display: flex; gap: .75rem; flex-wrap: wrap; align-items: center;
      padding: 1rem 1.5rem; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      margin-bottom: 1.25rem;
    }
    /* New invoice modal */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.45); z-index: 200;
      align-items: center; justify-content: center;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: var(--surface); border-radius: var(--radius);
      padding: 1.75rem; width: 100%; max-width: 440px;
      box-shadow: var(--shadow-lg);
    }
    .modal-box h3 { margin: 0 0 1.25rem; font-size: 1.05rem; }
    .modal-footer { display: flex; justify-content: flex-end; gap: .6rem; margin-top: 1rem; }
  </style>
</head>
<body data-shell="staff" data-nav="billing">
  <div class="app-shell">
    <main class="main">

      <div class="topbar">
        <div>
          <h1>صورتحساب و پرداخت</h1>
          <p class="subtitle">فاکتورها، پرداخت‌ها و درگاه‌های شاپرکی</p>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="btn-new-invoice">+ فاکتور جدید</button>
        </div>
      </div>

      <!-- KPI summary -->
      <div class="kpi-grid" id="billing-kpis" aria-live="polite">
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
        <div class="kpi-card"><div class="skeleton skeleton-line" style="width:60%"></div></div>
      </div>

      <!-- Filter bar -->
      <div class="filter-bar">
        <input class="form-input" id="filter-q" placeholder="جست‌وجو در فاکتورها…"
               style="flex:1;min-width:200px" aria-label="جست‌وجوی فاکتور"/>
        <select class="form-select" id="filter-status" style="max-width:160px" aria-label="فیلتر وضعیت">
          <option value="">همه وضعیت‌ها</option>
          <option value="paid">پرداخت شده</option>
          <option value="pending">در انتظار</option>
          <option value="failed">ناموفق</option>
          <option value="insurance_pending">در انتظار بیمه</option>
        </select>
        <select class="form-select" id="filter-gateway" style="max-width:160px" aria-label="فیلتر درگاه">
          <option value="">همه درگاه‌ها</option>
          <option value="zarinpal">Zarinpal</option>
          <option value="idpay">IDPay</option>
          <option value="bank_card">کارت بانکی</option>
        </select>
        <button class="btn btn-ghost btn-sm" id="btn-search">اعمال فیلتر</button>
      </div>

      <!-- Invoice table -->
      <div class="table-wrap" id="invoice-table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>شماره</th>
              <th>بیمار</th>
              <th>مبلغ (تومان)</th>
              <th>وضعیت</th>
              <th>درگاه</th>
              <th>تاریخ</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="invoice-tbody">
            <tr><td colspan="7" class="table-empty">در حال بارگذاری…</td></tr>
          </tbody>
        </table>
      </div>

      <!-- Pagination -->
      <div id="billing-pagination" style="display:flex;justify-content:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap"></div>

    </main>
  </div>

  <!-- New invoice modal -->
  <div class="modal-backdrop" id="new-invoice-modal" role="dialog" aria-modal="true" aria-label="فاکتور جدید">
    <div class="modal-box">
      <h3>فاکتور جدید</h3>
      <div class="input-group">
        <label class="form-label" for="inv-patient-id">شناسه بیمار</label>
        <input class="form-input" id="inv-patient-id" type="number" placeholder="مثلاً 42"/>
      </div>
      <div class="input-group" style="margin-top:.75rem">
        <label class="form-label" for="inv-amount">مبلغ (ریال)</label>
        <input class="form-input" id="inv-amount" type="number" placeholder="مثلاً 18500000" style="direction:ltr"/>
      </div>
      <div class="input-group" style="margin-top:.75rem">
        <label class="form-label" for="inv-gateway">درگاه پرداخت</label>
        <select class="form-select" id="inv-gateway">
          <option value="">— انتخاب کنید —</option>
          <option value="zarinpal">Zarinpal</option>
          <option value="idpay">IDPay</option>
          <option value="bank_card">کارت بانکی</option>
        </select>
      </div>
      <div class="input-group" style="margin-top:.75rem">
        <label class="form-label" for="inv-notes">توضیحات</label>
        <input class="form-input" id="inv-notes" placeholder="اختیاری"/>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost btn-sm" id="btn-invoice-cancel">انصراف</button>
        <button class="btn btn-primary btn-sm" id="btn-invoice-save">ذخیره</button>
      </div>
    </div>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/jalali.js"></script>
  <script src="../../assets/js/states.js"></script>
  <script src="../../assets/js/chrome.js"></script>
  <script type="module">
    import { Staff, renderError, showToast, escHtml, requireAuth, redirectOn401 } from '../../shared/api.js';
    if (!requireAuth('../auth/login.html')) { /* redirecting */ }

    const STATUS_LABELS = {
      paid: 'پرداخت شد', pending: 'در انتظار',
      failed: 'ناموفق', insurance_pending: 'در انتظار بیمه',
    };
    const STATUS_PILLS = {
      paid: 'success', pending: 'warning',
      failed: 'error', insurance_pending: 'info',
    };
    const STATUS_ACTIONS = {
      paid: null, pending: 'پیگیری', failed: 'پرداخت مجدد', insurance_pending: 'بررسی',
    };

    let currentPage = 1;
    let currentFilters = { q: '', status: '', gateway: '' };
    let totalRows = 0;
    const PER_PAGE = 20;

    /** Convert UTC DATETIME string to Jalali numeric ("۱۴۰۵/۰۵/۲۴"), fallback to substring. */
    function toJalaliDate(dateStr) {
      if (!dateStr) return '—';
      try {
        const d = new Date(String(dateStr).replace(' ', 'T'));
        if (isNaN(d.getTime())) return String(dateStr).substring(0, 10);
        return Jalali.formatNumeric(d);
      } catch (_) {
        return String(dateStr).substring(0, 10);
      }
    }

    function toCurrency(rials) {
      if (!rials && rials !== 0) return '—';
      const t = Math.round(rials / 10);
      return new Intl.NumberFormat('fa-IR').format(t);
    }

    function renderKpis(meta) {
      if (!meta) return;
      const g = document.getElementById('billing-kpis');
      g.innerHTML = [
        { label: 'مجموع فاکتورها', value: meta.total ?? '—', delta: '' },
        { label: 'پرداخت در انتظار', value: meta.pending_count ?? '—', delta: meta.pending_amount_label || '' },
        { label: 'پرداخت‌های ناموفق', value: meta.failed_count ?? '—', delta: '', err: (meta.failed_count > 0) },
        { label: 'میانگین فاکتور', value: meta.avg_label ?? '—', delta: '' },
      ].map(k => `
        <div class="kpi-card">
          <div class="kpi-label">${escHtml(k.label)}</div>
          <div class="kpi-value"${k.err ? ' style="color:var(--error)"' : ''}>${escHtml(String(k.value))}</div>
          ${k.delta ? `<div class="kpi-delta">${escHtml(k.delta)}</div>` : ''}
        </div>`).join('');
    }

    function renderTable(rows) {
      const tbody = document.getElementById('invoice-tbody');
      if (!rows || !rows.length) {
        tbody.innerHTML = '<tr><td colspan="7" class="table-empty">فاکتوری یافت نشد.</td></tr>';
        return;
      }
      tbody.innerHTML = rows.map(inv => {
        const pillClass = STATUS_PILLS[inv.status] || 'muted';
        const label = STATUS_LABELS[inv.status] || escHtml(inv.status || '');
        const action = STATUS_ACTIONS[inv.status];
        const actionBtn = action
          ? `<button class="btn btn-${inv.status === 'failed' ? 'primary' : 'ghost'} btn-sm js-status-btn"
               data-id="${inv.id}" data-status="${inv.status === 'failed' ? 'pending' : 'paid'}"
             >${escHtml(action)}</button>`
          : `<button class="btn btn-ghost btn-sm js-view-btn" data-id="${inv.id}">مشاهده</button>`;
        return `<tr>
          <td style="font-family:var(--font-mono);font-size:.85rem">#${escHtml(String(inv.invoice_number || inv.id || ''))}</td>
          <td>${escHtml(inv.patient_name || String(inv.patient_id || ''))}</td>
          <td style="direction:ltr;text-align:right;font-feature-settings:'tnum'">${toCurrency(inv.amount_rials)}</td>
          <td><span class="pill ${pillClass}">${label}</span></td>
          <td>${escHtml(inv.gateway || '—')}</td>
          <td>${escHtml(toJalaliDate(inv.created_at))}</td>
          <td>${actionBtn}</td>
        </tr>`;
      }).join('');

      // Status change buttons
      tbody.querySelectorAll('.js-status-btn').forEach(btn => {
        btn.addEventListener('click', async function() {
          const id = Number(this.dataset.id);
          const status = this.dataset.status;
          this.disabled = true;
          try {
            await Staff.updateInvoiceStatus(id, status);
            showToast('وضعیت فاکتور بروزرسانی شد.', 'success');
            loadInvoices();
          } catch (err) {
            showToast(err.message || 'خطا در بروزرسانی وضعیت.', 'error');
            this.disabled = false;
          }
        });
      });
    }

    function renderPagination(total, perPage, page) {
      const pg = document.getElementById('billing-pagination');
      const lastPage = Math.max(1, Math.ceil(total / perPage));
      if (lastPage <= 1) { pg.innerHTML = ''; return; }
      let html = '';
      for (let i = 1; i <= lastPage; i++) {
        html += `<button class="btn btn-sm ${i === page ? 'btn-primary' : 'btn-ghost'} js-page-btn"
          data-page="${i}">${i}</button>`;
      }
      pg.innerHTML = html;
      pg.querySelectorAll('.js-page-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          currentPage = Number(this.dataset.page);
          loadInvoices();
        });
      });
    }

    async function loadInvoices() {
      document.getElementById('invoice-tbody').innerHTML =
        '<tr><td colspan="7" class="table-empty">در حال بارگذاری…</td></tr>';
      try {
        const res = await Staff.listInvoices({ ...currentFilters, page: currentPage });
        // BillingController returns: { rows, total, page, per_page, summary }
        // No nested pagination object — derive last_page from total / per_page
        const d = res.data || res;
        totalRows = d.total ?? 0;
        const perPage = d.per_page ?? PER_PAGE;
        const page = d.page ?? currentPage;
        renderKpis(d.summary || d.meta);
        renderTable(d.rows || d.items || d.invoices || []);
        renderPagination(totalRows, perPage, page);
      } catch (err) {
        if (redirectOn401(err, '../auth/login.html')) return;
        renderError(document.getElementById('invoice-table-wrap'), err);
        showToast(err.message || 'خطا در بارگذاری فاکتورها', 'error');
      }
    }

    // Filter bar
    document.getElementById('btn-search').addEventListener('click', () => {
      currentPage = 1;
      currentFilters = {
        q: document.getElementById('filter-q').value,
        status: document.getElementById('filter-status').value,
        gateway: document.getElementById('filter-gateway').value,
      };
      loadInvoices();
    });

    // New invoice modal
    document.getElementById('btn-new-invoice').addEventListener('click', () => {
      document.getElementById('new-invoice-modal').classList.add('open');
    });
    document.getElementById('btn-invoice-cancel').addEventListener('click', () => {
      document.getElementById('new-invoice-modal').classList.remove('open');
    });
    document.getElementById('new-invoice-modal').addEventListener('click', function(e) {
      if (e.target === this) this.classList.remove('open');
    });

    document.getElementById('btn-invoice-save').addEventListener('click', async function() {
      const patientId = Number(document.getElementById('inv-patient-id').value);
      const amount = Number(document.getElementById('inv-amount').value);
      const gateway = document.getElementById('inv-gateway').value;
      const notes = document.getElementById('inv-notes').value.trim();
      if (!patientId || !amount) {
        showToast('شناسه بیمار و مبلغ اجباری هستند.', 'error'); return;
      }
      this.disabled = true;
      try {
        await Staff.createInvoice({ patient_id: patientId, amount_rials: amount, gateway: gateway || undefined, notes: notes || undefined });
        showToast('فاکتور با موفقیت ایجاد شد.', 'success');
        document.getElementById('new-invoice-modal').classList.remove('open');
        loadInvoices();
      } catch (err) {
        showToast(err.message || 'خطا در ایجاد فاکتور', 'error');
      } finally {
        this.disabled = false;
      }
    });

    loadInvoices();
  </script>
</body>
</html>

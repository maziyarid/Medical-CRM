<!doctype html>
<!--
  MΛZ Medical CRM — Patient Medical Records
  Author: MAZ//ID (Maziyar) · © 2026 Maziyar / Dr. Shahin Bastaninejad
  Data:  ✅ Wired to GET /api/v1/patient/records (app backend, Phase E)
  Auth:  Patient Bearer token required — requireAuth() guard.
-->
<html dir="rtl" lang="fa">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>پرونده پزشکی — داشبورد بیمار</title>
  <link rel="icon" type="image/svg+xml" href="../../assets/img/favicon.svg"/>
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet"/>
  <link rel="stylesheet" href="../../assets/css/tokens.css"/>
  <link rel="stylesheet" href="../../assets/css/tokens-extended.css"/>
  <link rel="stylesheet" href="../../assets/css/base.css"/>
  <link rel="stylesheet" href="../../assets/css/states.css"/>
  <link rel="stylesheet" href="../../assets/css/components.css"/>
  <style>
    .records-timeline { position: relative; padding-inline-start: 1.75rem; }
    .records-timeline::before {
      content: ''; position: absolute;
      inset-inline-start: .45rem; top: 0; bottom: 0;
      width: 2px; background: var(--border);
    }
    .tl-entry { position: relative; padding: 1rem 0; }
    .tl-dot {
      position: absolute; inset-inline-start: -1.38rem; top: 1.45rem;
      width: 13px; height: 13px; border-radius: 50%;
      background: var(--evergreen); border: 2.5px solid var(--porcelain);
    }
    .tl-card {
      background: var(--porcelain); border-radius: var(--radius-md);
      padding: 1rem 1.25rem;
    }
    .tl-card .tl-meta { font-size: .75rem; color: var(--muted); margin-bottom: .3rem; }
    .tl-card h4 { margin: 0 0 .3rem; font-size: .95rem; }
    .tl-card p  { font-size: .85rem; color: var(--muted); line-height: 1.7; margin: 0; }
    .tl-card .tl-pills { margin-top: .5rem; display: flex; gap: .35rem; }
    .tl-note { font-size: .82rem; color: var(--muted); padding: .65rem .75rem; background: var(--surface); border-radius: var(--radius-sm); }
  </style>
</head>
<body data-shell="patient" data-nav="records">
  <div class="app-shell">
    <main class="main">

      <div class="topbar">
        <div>
          <h1>پرونده پزشکی من</h1>
          <p class="subtitle">فقط قابل مشاهده — برای اصلاح با مرکز تماس بگیرید</p>
        </div>
      </div>

      <section class="panel">
        <h3 style="margin-bottom:1.25rem">ویزیت‌ها و یادداشت‌های پزشک</h3>

        <div class="records-timeline" id="records-timeline" role="list" aria-live="polite">
          <!-- JS renders entries here -->
          <div class="tl-entry">
            <div class="tl-dot" aria-hidden="true"></div>
            <div class="tl-card">
              <div class="skeleton skeleton-line" style="width:50%"></div>
              <div class="skeleton skeleton-line" style="width:70%;margin-top:.5rem"></div>
            </div>
          </div>
        </div>

        <!-- Pagination -->
        <div id="records-pagination" style="display:flex;justify-content:center;gap:.5rem;margin-top:1rem;flex-wrap:wrap"></div>

        <p style="font-size:.78rem;color:var(--muted);margin-top:1.25rem;padding-top:.75rem;border-top:1px solid var(--border)">
          ⚠ این اطلاعات توسط تیم پزشکی ثبت شده و فقط قابل مشاهده است.
          برای اصلاح با پذیرش مرکز تماس بگیرید.
        </p>
      </section>

    </main>
  </div>

  <script src="../../assets/js/app.js"></script>
  <script src="../../assets/js/states.js"></script>
  <script src="../../assets/js/chrome.js"></script>
  <script type="module">
    import { requireAuth, renderError, showToast, escHtml } from '../../shared/api.js';
    import { PatientExtended } from '../../shared/api.js';

    if (!requireAuth('../auth/patient-login.html')) { /* redirecting */ }

    const VISIT_LABELS = {
      consultation: 'مشاوره اولیه',
      pre_op:       'قبل از عمل',
      post_op:      'بعد از عمل',
      follow_up:    'ویزیت پیگیری',
      surgery:      'عمل جراحی',
    };

    let currentPage = 1;

    function formatDate(dateStr) {
      if (!dateStr) return '';
      // Just display as-is; server returns created_at in MySQL DATETIME format
      return dateStr.replace('T', ' ').substring(0, 10);
    }

    function renderEntries(items) {
      const timeline = document.getElementById('records-timeline');
      if (!items || !items.length) {
        timeline.innerHTML = `<div class="tl-entry">
          <div class="tl-card" style="text-align:center;color:var(--muted)">هنوز یادداشت پزشکی ثبت نشده است.</div>
        </div>`;
        return;
      }
      timeline.innerHTML = items.map(r => {
        const visitLabel = VISIT_LABELS[r.visit_type] || escHtml(r.visit_type || 'ویزیت');
        const pill = r.is_signed
          ? '<span class="pill evergreen">امضا شده</span>'
          : '<span class="pill info">ثبت شده</span>';
        const summary = r.assessment
          ? `<p>${escHtml(r.assessment)}</p>`
          : (r.subjective ? `<p>${escHtml(r.subjective)}</p>` : '');
        return `<div class="tl-entry" role="listitem">
          <div class="tl-dot" aria-hidden="true"></div>
          <div class="tl-card">
            <div class="tl-meta">${escHtml(formatDate(r.created_at))} · ${escHtml(r.author_name || 'دکتر باستانی‌نژاد')} · ${visitLabel}</div>
            <h4>${visitLabel}</h4>
            ${summary}
            ${r.plan ? `<div class="tl-note" style="margin-top:.45rem"><strong>برنامه درمانی:</strong> ${escHtml(r.plan)}</div>` : ''}
            <div class="tl-pills">${pill}</div>
          </div>
        </div>`;
      }).join('');
    }

    function renderPagination(pagination) {
      const pg = document.getElementById('records-pagination');
      if (!pagination || pagination.last_page <= 1) { pg.innerHTML = ''; return; }
      let html = '';
      for (let i = 1; i <= pagination.last_page; i++) {
        html += `<button class="btn btn-sm ${i === pagination.current_page ? 'btn-primary' : 'btn-ghost'} js-page-btn"
          data-page="${i}">${i}</button>`;
      }
      pg.innerHTML = html;
      pg.querySelectorAll('.js-page-btn').forEach(btn => {
        btn.addEventListener('click', function() {
          currentPage = Number(this.dataset.page);
          loadRecords();
        });
      });
    }

    async function loadRecords() {
      try {
        const res = await PatientExtended.getRecords({ page: currentPage });
        const d = res.data || res;
        renderEntries(d.items || []);
        renderPagination(d.pagination);
      } catch (err) {
        renderError(document.getElementById('records-timeline'), err);
        showToast(err.message || 'خطا در بارگذاری پرونده پزشکی', 'error');
      }
    }

    loadRecords();
  </script>
</body>
</html>

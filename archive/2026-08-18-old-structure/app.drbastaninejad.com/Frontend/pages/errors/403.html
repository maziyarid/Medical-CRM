<!DOCTYPE html>
<html lang="fa-IR" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>دسترسی غیرمجاز — ۴۰۳</title>
  <style>
    /* Irancell — self-hosted; standalone — no tokens.css dependency */
    @font-face { font-family:'Irancell'; font-weight:200; font-style:normal; font-display:swap;
      src: url('../../assets/fonts/Irancell/Irancell_ExtraLight.woff2') format('woff2'),
           url('../../assets/fonts/Irancell/Irancell_ExtraLight.woff')  format('woff'); }
    @font-face { font-family:'Irancell'; font-weight:300; font-style:normal; font-display:swap;
      src: url('../../assets/fonts/Irancell/Irancell_Light.woff2') format('woff2'),
           url('../../assets/fonts/Irancell/Irancell_Light.woff')  format('woff'); }
    @font-face { font-family:'Irancell'; font-weight:400; font-style:normal; font-display:swap;
      src: url('../../assets/fonts/Irancell/Irancell_Regular.woff2') format('woff2'),
           url('../../assets/fonts/Irancell/Irancell_Regular.woff')  format('woff'); }
    @font-face { font-family:'Irancell'; font-weight:500; font-style:normal; font-display:swap;
      src: url('../../assets/fonts/Irancell/Irancell_Medium.woff2') format('woff2'),
           url('../../assets/fonts/Irancell/Irancell_Medium.woff')  format('woff'); }
    @font-face { font-family:'Irancell'; font-weight:700; font-style:normal; font-display:swap;
      src: url('../../assets/fonts/Irancell/Irancell_Bold.woff2') format('woff2'),
           url('../../assets/fonts/Irancell/Irancell_Bold.woff')  format('woff'); }
    @font-face { font-family:'Irancell'; font-weight:800; font-style:normal; font-display:swap;
      src: url('../../assets/fonts/Irancell/Irancell_Extrabold.woff2') format('woff2'),
           url('../../assets/fonts/Irancell/Irancell_Extrabold.woff')  format('woff'); }
    /* Inline tokens — error pages must render standalone without any external CSS dependency */
    :root {
      --evergreen: #2F7D32;
      --evergreen-soft: #E4F0E4;
      --graphite: #25272C;
      --muted: #6A7078;
      --border: #DDE2DD;
      --porcelain: #F7F8F6;
      --surface: #FFFFFF;
      --error: #DC2626;
      --error-soft: #FEF2F2;
      --font-fa: 'Irancell', Tahoma, Arial, sans-serif;
      --radius: 1rem;
      --shadow: 0 20px 40px -12px rgba(37,39,44,.12);
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--font-fa);
      background: var(--porcelain);
      color: var(--graphite);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }
    :focus-visible { outline: 3px solid var(--evergreen); outline-offset: 2px; border-radius: 4px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 2.5rem 2rem;
      max-width: 440px;
      width: 100%;
      text-align: center;
    }
    .code-badge {
      display: inline-block;
      background: var(--error-soft);
      color: var(--error);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      padding: 0.25rem 0.75rem;
      border-radius: 999px;
      margin-bottom: 1.25rem;
    }
    .icon {
      font-size: 3.5rem;
      margin-bottom: 1rem;
      line-height: 1;
    }
    h1 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
    }
    p {
      font-size: 0.95rem;
      color: var(--muted);
      margin-bottom: 1.75rem;
      max-width: 320px;
      margin-inline: auto;
    }
    .actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.65rem 1.4rem;
      border-radius: 0.65rem;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      border: none;
      text-decoration: none;
      transition: opacity 150ms;
    }
    .btn:hover { opacity: 0.88; text-decoration: none; }
    .btn-primary { background: var(--evergreen); color: #fff; }
    .btn-ghost   { background: var(--porcelain); color: var(--graphite); border: 1px solid var(--border); }
    .footer-note {
      margin-top: 2rem;
      font-size: 0.78rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    @media (max-width: 480px) {
      .card { padding: 2rem 1.25rem; }
      .actions { flex-direction: column; }
      .btn { justify-content: center; }
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <span class="code-badge" aria-hidden="true">۴۰۳ — Forbidden</span>
    <div class="icon" role="img" aria-label="قفل">🔒</div>
    <h1>دسترسی غیرمجاز</h1>
    <p>
      شما مجاز به مشاهده این صفحه نیستید.
      اگر فکر می‌کنید این اشتباه است، با مدیر سیستم تماس بگیرید.
    </p>
    <div class="actions">
      <a href="/Frontend/pages/auth/login.html" class="btn btn-primary">ورود به حساب</a>
      <a href="/"                               class="btn btn-ghost">بازگشت به خانه</a>
    </div>
    <p class="footer-note">
      کد خطا: 403 — Forbidden
    </p>
  </main>
</body>
</html>

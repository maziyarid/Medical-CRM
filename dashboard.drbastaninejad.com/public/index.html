<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>سامانه کلینیک | دکتر شاهین باستانی‌نژاد</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#1f4d32">
  <link rel="stylesheet" href="assets/css/theme.css">
</head>
<body>
  <main class="content" style="max-width:640px;margin:12vh auto;padding:2rem">
    <section class="card" style="padding:2rem">
      <p class="sub" style="margin:0 0 .5rem">dashboard.drbastaninejad.com</p>
      <h1 style="margin:0 0 1rem;font-size:1.6rem">سامانه API کلینیک</h1>
      <p style="line-height:1.9;color:var(--muted)">
        این دامنه فقط برای ارتباط سرور با سرور است. ورود کارکنان و بیماران از پنل اصلی انجام می‌شود.
      </p>
      <p style="margin-top:1.5rem;display:flex;gap:.75rem;flex-wrap:wrap">
        <a class="btn btn-primary" href="https://app.drbastaninejad.com/Frontend/pages/auth/login.html">ورود کارکنان</a>
        <a class="btn btn-ghost" href="https://app.drbastaninejad.com/Frontend/pages/auth/patient-login.html">ورود بیمار</a>
      </p>
    </section>
  </main>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (reg) { reg.unregister(); });
      });
      if (window.caches) {
        caches.keys().then(function (keys) {
          keys.forEach(function (key) { caches.delete(key); });
        });
      }
    }
  </script>
</body>
</html>
